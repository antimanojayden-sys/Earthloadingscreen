<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      background-color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      border: 3px solid #0054e3;
    }

    .xp-title-bar {
      position: relative;
      z-index: 30;
      height: 36px;
      background: linear-gradient(
        180deg,
        #0997ff 0%,
        #0053ee 8%,
        #0050ee 40%,
        #06f 88%,
        #06f 93%,
        #005bff 95%,
        #003dd7 96%,
        #003dd7 100%
      );
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px 0 10px;
      user-select: none;
      flex-shrink: 0;
    }

    .xp-song-info {
      position: absolute;
      left: 50%;
      max-width: calc(100% - 210px);
      overflow: hidden;
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 12px;
      text-overflow: ellipsis;
      text-shadow: 1px 1px 1px #0f1089;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .xp-title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #ffffff;
      font-family: Tahoma, "Trebuchet MS", sans-serif;
      font-weight: bold;
      font-size: 16px;
      text-shadow: 1px 1px 1px #0f1089;
      cursor: pointer;
    }

    .xp-title-left:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }

    .xp-star-icon {
      font-size: 18px;
      line-height: 1;
    }

    .xp-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .xp-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #ffffff;
      border-radius: 3px;
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.35);
    }

    .xp-btn-blue {
      background: linear-gradient(180deg, #4b91ff 0%, #1d64e8 50%, #0d4bc7 100%);
    }

    .xp-btn-blue:hover {
      filter: brightness(1.12);
    }

    .xp-btn-blue:active {
      filter: brightness(0.9);
    }

    .xp-btn-close {
      background: linear-gradient(180deg, #f37d64 0%, #e04328 50%, #c1270e 100%);
    }

    .xp-btn-close:hover {
      filter: brightness(1.12);
    }

    .xp-btn-close:active {
      filter: brightness(0.9);
    }

    .menu-screen {
      position: absolute;
      inset: 36px 0 0;
      z-index: 20;
      overflow: hidden;
      background: #ffffff;
      opacity: 1;
      transition: opacity 1.6s ease;
    }

    .menu-screen[hidden],
    .menu-content[hidden] {
      display: none;
    }

    .menu-screen.leaving {
      opacity: 0;
      pointer-events: none;
    }

    .menu-content {
      position: absolute;
      top: calc(50% - 8px);
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: min(320px, 90%);
      transform: translateX(-50%);
      text-align: center;
    }

    .menu-title {
      margin-bottom: 8px;
      color: #202122;
      font-family: Tahoma, Arial, sans-serif;
      font-size: clamp(56px, 8vw, 88px);
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.18);
    }

    #menuHome .menu-title {
      margin-bottom: 0;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: clamp(64px, 9vw, 112px);
      font-style: italic;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-shadow: none;
    }

    #menuHome > .menu-button {
      width: 100%;
      max-width: 100%;
      min-height: 44px;
      font-size: 18px;
    }

    .menu-button {
      width: 260px;
      max-width: 90%;
      min-height: 54px;
      border: 2px solid #202122;
      border-radius: 2px;
      background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 100%);
      color: #202122;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 20px;
      font-style: italic;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #202122;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .menu-button:hover {
      background: #e8e8e8;
      box-shadow: 5px 5px 0 #202122;
      transform: translate(-1px, -1px);
    }

    .menu-button:active {
      box-shadow: 1px 1px 0 #202122;
      transform: translate(3px, 3px);
    }

    .menu-button:focus-visible {
      outline: 3px solid #0054e3;
      outline-offset: 3px;
    }

    .share-copy-button {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 40;
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
    }

    .share-copy-button[hidden] {
      display: none;
    }

    .share-copy-button:focus-visible {
      outline: 3px solid #0054e3;
      outline-offset: 3px;
    }

    .share-copy-button span {
      font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
      font-size: 32px;
      font-weight: normal;
      line-height: 1;
    }

    .copy-link-status {
      position: fixed;
      right: 20px;
      bottom: 82px;
      z-index: 40;
      max-width: min(280px, calc(100vw - 40px));
      padding: 10px 14px;
      border: 1px solid #202122;
      background: #ffffff;
      color: #202122;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 14px;
      box-shadow: 2px 2px 0 #202122;
    }

    .copy-link-status[hidden] {
      display: none;
    }

    .credits-name {
      margin-bottom: 12px;
      color: #202122;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 20px;
      font-weight: 900;
    }

    .credits-view {
      width: min(680px, 90%);
      gap: 0;
    }

    .credits-card {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #202122;
      background: #ffffff;
      box-shadow: 4px 4px 0 #202122;
    }

    .credits-card .menu-title {
      margin-bottom: 4px;
      font-size: clamp(40px, 5vw, 56px);
      font-style: italic;
      font-weight: 900;
    }

    .credits-attribution {
      color: #333333;
      font-size: 14px;
      line-height: 1.35;
      text-align: left;
    }

    .credits-attribution p + p {
      margin-top: 7px;
    }

    .credits-attribution a {
      color: #0645ad;
      font-weight: bold;
      text-decoration: underline;
    }

    .credits-card .menu-button {
      margin-top: 14px;
    }

    .menu-globe {
      --menu-globe-size: clamp(180px, calc(50vh - 45px), 400px);
      position: fixed;
      top: calc(50vh - 6px - var(--menu-globe-size));
      left: 50%;
      z-index: 25;
      width: var(--menu-globe-size);
      height: var(--menu-globe-size);
      object-fit: contain;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .main-content {
      flex-grow: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }

    .main-content.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .thumb-card {
      background-color: #f8f9fa;
      border: 2px solid #c8ccd1;
      padding: 16px;
      width: 1100px;
      max-width: calc(100vw - 60px);
      opacity: 0;
      transform: scale(0.8075) translateY(6px);
      transition: opacity 1s ease, transform 1s ease;
      cursor: pointer;
    }

    .thumb-card.visible {
      opacity: 1;
      transform: scale(0.8075) translateY(0);
    }

    .thumb-card img {
      width: 100%;
      height: 640px;
      max-height: 60vh;
      object-fit: contain;
      display: block;
      border: 2px solid #c8ccd1;
    }

    .thumb-caption {
      font-size: clamp(22px, 2.65vw, 36px);
      line-height: 1.4;
      color: #202122;
      padding: 20px 8px 8px 8px;
      text-align: left;
    }

    .article-description {
      display: block;
      max-height: 2.8em;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 8px;
      cursor: auto;
    }

    .thumb-caption a {
      color: #0645ad;
      text-decoration: none;
    }

    .thumb-caption a:hover {
      text-decoration: underline;
    }

    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      gap: 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }

    .footer-bar.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .tip-container {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
      max-width: 55%;
    }

    .help-icon {
      width: clamp(64px, 7.32vw, 100px);
      height: clamp(64px, 7.32vw, 100px);
      flex-shrink: 0;
    }

    .tip-text {
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(18px, 2.2vw, 30px);
      line-height: 1.25;
      color: #333333;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .tip-text.visible {
      opacity: 1;
    }

    .loading-status {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.9vw, 12px);
      width: clamp(220px, 36vw, 580px);
      margin-right: 0;
      flex-shrink: 0;
    }

    .globe-icon {
      width: clamp(64px, 7.32vw, 100px);
      height: clamp(64px, 7.32vw, 100px);
      flex-shrink: 0;
    }

    .globe-slot {
      display: block;
      width: clamp(64px, 7.32vw, 100px);
      height: clamp(64px, 7.32vw, 100px);
      flex-shrink: 0;
    }

    .loading-text {
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(36px, 5.6vw, 84px);
      color: #4a6b82;
      letter-spacing: 0.5px;
      white-space: pre;
    }

    @media (max-width: 900px) {
      .footer-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 10px 20px;
      }

      .tip-container {
        max-width: none;
      }

      .loading-status {
        align-self: center;
      }
    }

    @media (max-height: 800px) {
      .thumb-card img {
        max-height: 45vh;
      }

      .footer-bar {
        padding-top: 8px;
        padding-bottom: 8px;
      }
    }

    @media (max-height: 500px) {
      .thumb-card img {
        max-height: 18vh;
      }

      .thumb-caption {
        padding: 8px 8px 4px;
      }

      .article-description {
        max-height: 2em;
      }
    }
  </style>
</head>
<body>

  <div class="xp-title-bar">
    <button class="xp-title-left" id="homeBtn" type="button" aria-label="Return to main menu">
      <span class="xp-star-icon">🜨</span>
      <span>Earth</span>
    </button>
    <div class="xp-song-info" id="songInfo" aria-live="polite">Song info appears when music starts</div>
    <div class="xp-controls">
      <button class="xp-btn xp-btn-blue" id="muteBtn" title="Mute / Unmute">🔊</button>
      <button class="xp-btn xp-btn-blue" id="skipBtn" title="Skip to next song" aria-label="Skip to next song">⏭</button>
      <button class="xp-btn xp-btn-blue" id="fullscreenBtn" title="Toggle Fullscreen">❐</button>
      <button class="xp-btn xp-btn-close" id="closeBtn" title="Close">✕</button>
    </div>
  </div>

  <audio id="soundtrack"></audio>

  <section class="menu-screen" id="menuScreen" aria-label="Main menu">
    <div class="menu-content" id="menuHome">
      <h1 class="menu-title">Earth</h1>
      <button class="menu-button" id="startBtn" type="button">Start</button>
      <button class="menu-button" id="creditsBtn" type="button">Credits</button>
    </div>

    <div class="menu-content credits-view" id="creditsView" hidden>
      <section class="credits-card" aria-labelledby="creditsTitle">
        <h1 class="menu-title" id="creditsTitle">Credits</h1>
        <p class="credits-name">Created by Jayden A.</p>
        <div class="credits-attribution">
          <p>Wikipedia articles and excerpts: <a href="https://en.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia contributors</a>.</p>
          <p>Article text is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>, unless otherwise noted.</p>
          <p>Image licenses may differ; see each linked article for image attribution.</p>
        </div>
        <button class="menu-button" id="backBtn" type="button">Back</button>
      </section>
    </div>
  </section>
  <img class="menu-globe" id="globeIcon" src="images/thearth.gif" alt="Globe">

  <div class="main-content" id="mainContent">
    <div class="thumb-card" id="thumbCard">
      <img id="cardImage" src="" alt="">
      <div class="thumb-caption" id="cardCaption"></div>
    </div>
  </div>

  <div class="footer-bar" id="footerBar">
    <div class="tip-container">
      <img class="help-icon" src="images/questionmark.jfif" alt="Help">
      <div class="tip-text" id="tipText"></div>
    </div>

    <div class="loading-status">
      <span class="globe-slot" id="globeSlot" aria-hidden="true"></span>
      <span class="loading-text" id="loadingText"></span>
    </div>
  </div>

  <button class="share-copy-button" id="copyPageLinkBtn" type="button" title="Copy page link" aria-label="Copy page link">
    <span aria-hidden="true">&#x2332;</span>
  </button>
  <div class="copy-link-status" id="copyLinkStatus" role="status" aria-live="polite" hidden></div>

  <script src="Tips - Sheet1.js"></script>
  <script>
    const wikipediaApiUrl = "https://en.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&grnlimit=10&prop=pageimages%7Cextracts&piprop=thumbnail&pithumbsize=1200&exintro=1&explaintext=1&exsentences=1&format=json&origin=*";
    const wikipediaStartDelay = 5000;
    const wikipediaDisplayDuration = 4000;
    const cardFadeDuration = 1000;

    const tips = Array.isArray(window.earthTips) ? window.earthTips : [];

    const playlist = [
      { file: "music/AquaticAmbience.mp3", title: "Aquatic Ambience", artist: "Scizzie" },
      { file: "music/LEASE.mp3", title: "LEASE", artist: "Takeshi Abo" },
      { file: "music/r e f l e c t i o n s.mp3", title: "r e f l e c t i o n s", artist: "Azylea" },
      { file: "music/dirediredocks.mp3", title: "Dire, Dire Docks", artist: "Koji Kondo" },
      { file: "music/formula06mainmenu.mp3", title: "Formula 1 06 Main Menu", artist: "Dr. Perceptron" },
      { file: "music/lotuswaters.mp3", title: "Lotus Waters", artist: "Mosenite" },
      { file: "music/newyou.mp3", title: "New You", artist: "Xploshi" },
      { file: "music/wiimainmenu.mp3", title: "Wii Main Menu", artist: "Kazumi Totaka" },
      { file: "music/wiiumiimaker.mp3", title: "Making a Mii (Wii U)", artist: "Kazumi Totaka" }
    ];

    const thumbCard = document.getElementById("thumbCard");
    const cardImage = document.getElementById("cardImage");
    const cardCaption = document.getElementById("cardCaption");
    const tipText = document.getElementById("tipText");
    const loadingText = document.getElementById("loadingText");
    const soundtrack = document.getElementById("soundtrack");
    const homeBtn = document.getElementById("homeBtn");
    const muteBtn = document.getElementById("muteBtn");
    const skipBtn = document.getElementById("skipBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const closeBtn = document.getElementById("closeBtn");
    const songInfo = document.getElementById("songInfo");
    const menuScreen = document.getElementById("menuScreen");
    const menuHome = document.getElementById("menuHome");
    const creditsView = document.getElementById("creditsView");
    const startBtn = document.getElementById("startBtn");
    const copyPageLinkBtn = document.getElementById("copyPageLinkBtn");
    const copyLinkStatus = document.getElementById("copyLinkStatus");
    const creditsBtn = document.getElementById("creditsBtn");
    const backBtn = document.getElementById("backBtn");
    const globeIcon = document.getElementById("globeIcon");
    const globeSlot = document.getElementById("globeSlot");
    const mainContent = document.getElementById("mainContent");
    const footerBar = document.getElementById("footerBar");

    let previousPageId = null;
    let loadingCard = false;
    let currentTrack = null;
    let tipIndex = 0;
    let trackIndex = 0;
    let experienceStarted = false;
    let startingExperience = false;
    let experienceGeneration = 0;
    let wikipediaReady = false;
    let wikipediaTimeoutId = null;
    let cardTimeoutId = null;
    let tipIntervalId = null;
    let loadingTimeoutId = null;
    let copyStatusTimeoutId = null;

    soundtrack.addEventListener("play", () => {
      if (currentTrack) {
        songInfo.textContent = "Song playing - " + currentTrack.title + " by " + currentTrack.artist;
      }
    });

    muteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (soundtrack.paused && !soundtrack.muted && soundtrack.currentSrc) {
        soundtrack.play().catch(error => console.error("Could not start soundtrack:", error));
        muteBtn.textContent = "🔊";
      } else {
        soundtrack.muted = !soundtrack.muted;
        muteBtn.textContent = soundtrack.muted ? "🔇" : "🔊";
      }
    });

    skipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      playNextTrack();
    });

    fullscreenBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        fullscreenBtn.textContent = "❏";
      } else {
        document.exitFullscreen();
        fullscreenBtn.textContent = "❐";
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenBtn.textContent = document.fullscreenElement ? "❏" : "❐";
    });

    closeBtn.addEventListener("click", () => {
      window.close();
      document.body.innerHTML = "";
      document.body.style.backgroundColor = "#000000";
      document.body.style.border = "none";
    });

    homeBtn.addEventListener("click", returnToMenu);
    copyPageLinkBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        copyLinkStatus.textContent = "Link copied!";
      } catch (error) {
        console.error("Could not copy page link:", error);
        copyLinkStatus.textContent = "Could not copy the link. Copy the page address from your browser.";
      }

      copyLinkStatus.hidden = false;
      clearTimeout(copyStatusTimeoutId);
      copyStatusTimeoutId = setTimeout(() => {
        copyLinkStatus.hidden = true;
      }, 2500);
    });

    creditsBtn.addEventListener("click", () => {
      menuHome.hidden = true;
      creditsView.hidden = false;
    });

    backBtn.addEventListener("click", () => {
      creditsView.hidden = true;
      menuHome.hidden = false;
    });

    startBtn.addEventListener("click", startExperience);

    async function startExperience() {
      if (experienceStarted) return;
      const startTime = performance.now();
      experienceStarted = true;
      startingExperience = true;
      startBtn.disabled = true;
      copyPageLinkBtn.hidden = true;
      copyLinkStatus.hidden = true;
      clearTimeout(copyStatusTimeoutId);
      playNextTrack();

      const start = globeIcon.getBoundingClientRect();
      const destination = globeSlot.getBoundingClientRect();
      globeIcon.style.position = "fixed";
      globeIcon.style.left = start.left + "px";
      globeIcon.style.top = start.top + "px";
      globeIcon.style.width = start.width + "px";
      globeIcon.style.height = start.height + "px";
      globeIcon.style.transform = "none";
      menuScreen.classList.add("leaving");

      const animation = globeIcon.animate(
        [
          { left: start.left + "px", top: start.top + "px", width: start.width + "px", height: start.height + "px" },
          { left: destination.left + "px", top: destination.top + "px", width: destination.width + "px", height: destination.height + "px" }
        ],
        { duration: 1600, easing: "ease-in-out", fill: "forwards" }
      );
      await animation.finished;

      globeIcon.style.left = destination.left + "px";
      globeIcon.style.top = destination.top + "px";
      globeIcon.style.width = destination.width + "px";
      globeIcon.style.height = destination.height + "px";
      animation.cancel();
      globeIcon.classList.remove("menu-globe");
      globeIcon.classList.add("globe-icon");
      globeIcon.style.cssText = "";
      globeSlot.replaceWith(globeIcon);

      menuScreen.hidden = true;
      mainContent.classList.add("visible");
      footerBar.classList.add("visible");
      startingExperience = false;

      if (tips.length > 0) {
        tips.sort(() => Math.random() - 0.5);
        cycleTip();
      } else {
        console.error("Could not load tips from Tips - Sheet1.js.");
        tipText.textContent = "Tips could not be loaded. Check that Tips - Sheet1.js is available.";
        tipText.classList.add("visible");
      }
      typeLoading();
      const delayUntilWikipedia = Math.max(0, wikipediaStartDelay - (performance.now() - startTime));
      wikipediaTimeoutId = setTimeout(() => {
        if (!experienceStarted) return;
        wikipediaReady = true;
        cycleCard();
      }, delayUntilWikipedia);
      tipIntervalId = setInterval(cycleTip, 6000);
    }

    function returnToMenu() {
      if (startingExperience) return;

      menuHome.hidden = false;
      creditsView.hidden = true;
      menuScreen.classList.remove("leaving");
      menuScreen.hidden = false;
      copyPageLinkBtn.hidden = false;
      copyLinkStatus.hidden = true;
      clearTimeout(copyStatusTimeoutId);

      if (!experienceStarted) return;

      experienceStarted = false;
      experienceGeneration++;
      wikipediaReady = false;
      clearTimeout(wikipediaTimeoutId);
      clearTimeout(cardTimeoutId);
      clearInterval(tipIntervalId);
      clearTimeout(loadingTimeoutId);
      wikipediaTimeoutId = null;
      cardTimeoutId = null;
      tipIntervalId = null;
      loadingTimeoutId = null;

      mainContent.classList.remove("visible");
      footerBar.classList.remove("visible");
      thumbCard.classList.remove("visible");
      cardImage.removeAttribute("src");
      cardImage.alt = "";
      cardCaption.replaceChildren();
      tipText.classList.remove("visible");
      tipText.textContent = "";
      loadingText.textContent = "";
      charIndex = 0;
      loadingCard = false;
      startBtn.disabled = false;
      previousPageId = null;

      globeIcon.replaceWith(globeSlot);
      globeIcon.classList.remove("globe-icon");
      globeIcon.classList.add("menu-globe");
      globeIcon.style.cssText = "";
      menuScreen.after(globeIcon);
    }

    async function cycleCard() {
      if (!experienceStarted || loadingCard) return;
      clearTimeout(cardTimeoutId);
      cardTimeoutId = null;
      loadingCard = true;
      const generation = experienceGeneration;
      const fadeOut = thumbCard.classList.contains("visible");
      thumbCard.classList.remove("visible");

      try {
        if (fadeOut) {
          await new Promise(resolve => setTimeout(resolve, cardFadeDuration));
        }
        if (!experienceStarted || generation !== experienceGeneration) return;

        const response = await fetch(wikipediaApiUrl);
        if (!response.ok) {
          throw new Error("Wikipedia request failed: " + response.status);
        }

        const data = await response.json();
        if (!experienceStarted || generation !== experienceGeneration) return;
        const pages = data.query && data.query.pages ? Object.values(data.query.pages) : [];
        const choices = pages.filter(page =>
          page.thumbnail && page.thumbnail.source && page.extract && page.pageid !== previousPageId
        );

        if (choices.length === 0) {
          throw new Error("Wikipedia did not return an article with both a photo and a description.");
        }

        const current = choices[Math.floor(Math.random() * choices.length)];
        previousPageId = current.pageid;
        cardImage.src = current.thumbnail.source;
        cardImage.alt = "Photo from the Wikipedia article " + current.title;
        cardCaption.replaceChildren();

        const articleLink = document.createElement("a");
        articleLink.href = "https://en.wikipedia.org/?curid=" + current.pageid;
        articleLink.target = "_blank";
        articleLink.rel = "noopener noreferrer";
        articleLink.textContent = current.title;
        const articleDescription = document.createElement("span");
        articleDescription.className = "article-description";
        articleDescription.textContent = current.extract;
        cardCaption.append(articleLink, articleDescription);
        thumbCard.classList.add("visible");
      } catch (error) {
        if (!experienceStarted || generation !== experienceGeneration) return;
        console.error("Could not load a Wikipedia article:", error);
        cardImage.removeAttribute("src");
        cardImage.alt = "";
        cardCaption.textContent = "Wikipedia could not load an article just now. It will try again shortly.";
        thumbCard.classList.add("visible");
      } finally {
        if (generation === experienceGeneration) {
          loadingCard = false;
          if (experienceStarted && wikipediaReady) {
            cardTimeoutId = setTimeout(cycleCard, wikipediaDisplayDuration);
          }
        }
      }
    }

    thumbCard.addEventListener("click", (event) => {
      if (!wikipediaReady || !(event.target instanceof Element)) return;
      if (event.target.closest("a") || event.target.closest(".article-description")) return;
      cycleCard();
    });

    function cycleTip() {
      if (tips.length === 0) return;
      tipText.classList.remove("visible");

      setTimeout(() => {
        tipText.textContent = tips[tipIndex];
        tipText.classList.add("visible");

        tipIndex = (tipIndex + 1) % tips.length;
      }, 600);
    }

    const fullLoadingString = "Loading . . .";
    let charIndex = 0;

    function typeLoading() {
      if (!experienceStarted) return;
      if (charIndex <= fullLoadingString.length) {
        loadingText.textContent = fullLoadingString.slice(0, charIndex);
        charIndex++;
        loadingTimeoutId = setTimeout(typeLoading, 90);
      } else {
        loadingTimeoutId = setTimeout(() => {
          charIndex = 0;
          typeLoading();
        }, 1200);
      }
    }

    function playNextTrack() {
      if (playlist.length === 0) return;
      currentTrack = playlist[trackIndex];
      soundtrack.src = currentTrack.file;
      soundtrack.play().catch(error => console.error("Could not start soundtrack:", error));
      trackIndex = (trackIndex + 1) % playlist.length;
    }

    soundtrack.addEventListener("ended", playNextTrack);

    document.addEventListener("click", (event) => {
      if (experienceStarted && event.target !== startBtn && soundtrack.paused && !soundtrack.muted && soundtrack.currentSrc) {
        soundtrack.play().catch(error => console.error("Could not start soundtrack:", error));
      }
    }, { once: true });

  </script>

</body>
